[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-local-logistic"
version = "0.1.0"
description = "K-means++ routing with cluster-specific logistic regression for binary classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<4",
    "scikit-learn>=1.7,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

